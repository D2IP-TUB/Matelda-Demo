<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matelda · Live</title>
<script>
  // Theme before first paint: ?theme=light|dark wins, then the saved choice (same key as the app), else the system.
  (function () {
    var t = new URLSearchParams(location.search).get("theme");
    try { t = t || localStorage.getItem("matelda-theme"); } catch (e) {}
    // A projector stage, like the landing page: dark unless light was picked explicitly.
    document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
    // Language before first paint: ?lang=de|en wins, then the saved choice (same key as the app), else English.
    var l = new URLSearchParams(location.search).get("lang");
    try { l = l || localStorage.getItem("matelda-lang"); } catch (e) {}
    document.documentElement.lang = l === "de" ? "de" : "en";
  })();
</script>
<style>
  /*
   * Matelda live dashboard. Same design system as the React app (frontend/src/styles/tokens.css,
   * docs/style-guide.md) and styled like its working pages (frontend/src/styles/app.css).
   * PocketBase serves this page on its own, so the tokens are inlined here. Keep them in sync.
   */
  :root {
    color-scheme: light dark;
    --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', Inter, 'Segoe UI', Roboto, system-ui, sans-serif;
    --font-mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace;
    --text-caption: 0.75rem; --text-footnote: 0.8125rem; --text-body: 1rem; --text-callout: 1.0625rem;
    --text-title3: 1.25rem; --text-title2: 1.5rem; --text-title1: 2rem; --text-display: clamp(2rem, 4vw + 1rem, 3rem);
    --lh-tight: 1.15; --lh-body: 1.5; --track-tight: -0.022em;
    --s-1: 0.25rem; --s-2: 0.5rem; --s-3: 0.75rem; --s-4: 1rem; --s-5: 1.5rem; --s-6: 2rem; --s-7: 3rem;
    --r-sm: 8px; --r-md: 12px; --r-lg: 18px; --r-xl: 24px; --r-pill: 999px;
    --hit: 44px; /* minimum touch target */
    --panel-r: var(--r-xl); --panel-pad: var(--s-5); --panel-shadow: var(--shadow-1);
    --tile-r: var(--r-lg); --tile-pad: var(--s-4); --tile-shadow: var(--shadow-1);
    --hero-r: var(--r-xl); --hero-pad: var(--s-6); --hero-shadow: var(--shadow-2);
    --dur-fast: 120ms; --dur-base: 220ms; --dur-slow: 380ms;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1); --ease-spring: cubic-bezier(0.34, 1.4, 0.64, 1);

    /* light: the landing's daylight twin */
    --bg: #f4f5fa; --surface: #ffffff; --surface-2: #eceef6;
    --fill: rgb(40 50 90 / 8%); --fill-hover: rgb(40 50 90 / 14%);
    --label: #0b0d16; --label-2: #565b70; --label-3: #8a8fa3;
    --separator: rgb(11 13 22 / 12%);
    --accent: #1a62c9; --accent-tint: rgb(26 98 201 / 10%); --accent-ring: rgb(26 98 201 / 35%);
    --accent-fill: #1a62c9; --on-accent: #ffffff; --accent-text: var(--accent);
    --cta-bg: var(--accent-fill); --cta-fg: #ffffff;
    --good: #1a7f37; --good-tint: rgb(26 127 55 / 12%); --bad: #c9231a; --bad-tint: rgb(201 35 26 / 10%);
    --warn: #8a5a00; --warn-tint: rgb(255 159 10 / 16%);
    --brand-gradient: linear-gradient(100deg, #4f9bf0, #1a62c9 55%, #134a99);
    --cta-glow: 0 6px 20px -4px rgb(26 98 201 / 18%);
    --aurora: radial-gradient(900px 500px at 78% -5%, rgb(47 127 230 / 12%), transparent 60%),
      radial-gradient(700px 420px at 5% 30%, rgb(26 98 201 / 8%), transparent 60%);
    --material: rgb(244 245 250 / 74%);
    --shadow-1: 0 1px 2px rgb(11 13 22 / 5%), 0 1px 1px rgb(11 13 22 / 3%);
    --shadow-2: 0 1px 4px rgb(11 13 22 / 4%), 0 6px 20px rgb(11 13 22 / 4%);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --bg: #07080d; --surface: #12141d; --surface-2: #1a1d29;
      --fill: rgb(255 255 255 / 10%); --fill-hover: rgb(255 255 255 / 16%);
      --label: #f5f5f7; --label-2: #a9adbd; --label-3: #6b7085;
      --separator: rgb(255 255 255 / 10%);
      --accent: #3b99ff; --accent-tint: rgb(59 153 255 / 16%); --accent-ring: rgb(59 153 255 / 50%);
      --accent-fill: #0b72e0; --on-accent: #ffffff; --accent-text: var(--label); /* never blue text on black */
      --cta-bg: #ffffff; --cta-fg: #07080d;
      --warn: #ffb340; --warn-tint: rgb(255 159 10 / 20%);
      --cta-glow: 0 6px 20px -4px rgb(59 153 255 / 18%);
      --good: #30d158; --good-tint: rgb(48 209 88 / 18%); --bad: #ff6b61; --bad-tint: rgb(255 107 97 / 18%);
      --brand-gradient: linear-gradient(100deg, #ffffff, #e3f0ff 55%, #b4d6fa);
      --aurora: radial-gradient(900px 500px at 78% -5%, rgb(170 210 255 / 10%), transparent 60%),
        radial-gradient(700px 420px at 5% 30%, rgb(150 195 245 / 6%), transparent 60%);
      --material: rgb(7 8 13 / 72%);
      --shadow-1: 0 0 0 0.5px rgb(255 255 255 / 7%);
      --shadow-2: 0 0 0 0.5px rgb(255 255 255 / 8%), 0 6px 20px rgb(0 0 0 / 28%);
    }
  }
  :root[data-theme='dark'] {
    color-scheme: dark;
    --bg: #07080d; --surface: #12141d; --surface-2: #1a1d29;
    --fill: rgb(255 255 255 / 10%); --fill-hover: rgb(255 255 255 / 16%);
    --label: #f5f5f7; --label-2: #a9adbd; --label-3: #6b7085;
    --separator: rgb(255 255 255 / 10%);
    --accent: #3b99ff; --accent-tint: rgb(59 153 255 / 16%); --accent-ring: rgb(59 153 255 / 50%);
      --accent-fill: #0b72e0; --on-accent: #ffffff; --accent-text: var(--label); /* never blue text on black */
      --cta-bg: #ffffff; --cta-fg: #07080d;
      --warn: #ffb340; --warn-tint: rgb(255 159 10 / 20%);
      --cta-glow: 0 6px 20px -4px rgb(59 153 255 / 18%);
    --good: #30d158; --good-tint: rgb(48 209 88 / 18%); --bad: #ff6b61; --bad-tint: rgb(255 107 97 / 18%);
    --brand-gradient: linear-gradient(100deg, #ffffff, #e3f0ff 55%, #b4d6fa);
    --aurora: radial-gradient(900px 500px at 78% -5%, rgb(170 210 255 / 10%), transparent 60%),
      radial-gradient(700px 420px at 5% 30%, rgb(150 195 245 / 6%), transparent 60%);
    --material: rgb(7 8 13 / 72%);
    --shadow-1: 0 0 0 0.5px rgb(255 255 255 / 7%);
      --shadow-2: 0 0 0 0.5px rgb(255 255 255 / 8%), 0 6px 20px rgb(0 0 0 / 28%);
  }
  :root[data-theme='light'] { color-scheme: light; }
  /* card padding shrinks on phones so content keeps its width (as in the app) */
  @media (max-width: 480px) { :root { --panel-pad: var(--s-4); --tile-pad: var(--s-3); --hero-pad: var(--s-5); } }

  /* ---------- base ---------- */
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg) var(--aurora) fixed no-repeat; color: var(--label);
    font-family: var(--font-sans); font-size: var(--text-body); line-height: var(--lh-body);
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  h1, h2 { margin: 0; letter-spacing: var(--track-tight); line-height: var(--lh-tight); }
  :focus-visible { outline: 3px solid var(--accent-ring); outline-offset: 2px; border-radius: var(--r-sm); }
  .num, .score, .stat b, td { font-variant-numeric: tabular-nums; }

  /* ---------- top bar: the app's own (frontend/src/styles/app.css .topbar) ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between; gap: var(--s-3);
    min-height: 64px; padding: 0 max(var(--s-5), env(safe-area-inset-left));
    background: var(--material); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 0.5px solid var(--separator); font-size: var(--text-footnote);
  }
  .brand { display: flex; align-items: center; gap: var(--s-4); min-width: 0; }
  .wordmark { font-weight: 800; font-size: var(--text-title2); line-height: 1.15; letter-spacing: var(--track-tight); color: var(--accent-text); }
  .logo { height: 32px; width: auto; padding: 6px 12px; border-radius: var(--r-pill); background: #fff; box-shadow: var(--shadow-1); }
  .bar-end { display: flex; align-items: center; gap: var(--s-2); }
  .status {
    display: inline-flex; align-items: center; gap: var(--s-2); min-height: 32px; padding: 0 var(--s-3);
    border-radius: var(--r-pill); background: var(--fill); color: var(--label-2); font-weight: 600;
  }
  .status.live { color: var(--label); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); flex: none; }
  .status.live .dot { background: var(--good); animation: dot-pulse 2s ease-out infinite; }
  @keyframes dot-pulse { 0% { box-shadow: 0 0 0 0 var(--good-tint); } 70%, 100% { box-shadow: 0 0 0 8px transparent; } }
  .theme-toggle, .lang-toggle {
    position: relative; display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 0;
    border: 0; border-radius: 50%; background: var(--fill); color: var(--label); cursor: pointer;
    font: inherit; font-size: 12px; font-weight: 600; letter-spacing: 0.02em;
    transition: background var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
  }
  .theme-toggle:hover, .lang-toggle:hover { background: var(--fill-hover); }
  .theme-toggle:active, .lang-toggle:active { transform: scale(0.92); }
  /* touch: at least --hit (44px) to press, without making the bar look heavier */
  @media (pointer: coarse) {
    .lang-toggle::after, .theme-toggle::after { content: ''; position: absolute; inset: calc((36px - var(--hit)) / 2); }
  }

  /* ---------- page ----------
   * A keynote stage built from the landing page's pieces: aurora glow, one gradient headline, huge numerals,
   * hairline panels that rise in one after another. Compact: on a wide screen everything fits one viewport.
   */
  .page { position: relative; isolation: isolate; max-width: min(1600px, 100%); margin: 0 auto; padding: var(--s-5) max(var(--s-5), env(safe-area-inset-left)) var(--s-5); }
  /* the landing's aurora, drifting slowly behind the hero (the lobby's motion) */
  .aurora {
    position: absolute; z-index: -1; inset: -120px -10% auto; height: 560px; pointer-events: none;
    background: var(--aurora); filter: blur(24px); animation: drift 16s ease-in-out infinite alternate;
  }
  @keyframes drift { from { transform: translate3d(-3%, 0, 0) scale(1); } to { transform: translate3d(3%, 16px, 0) scale(1.08); } }

  /* entrance: one block after the other (the landing's 160 ms stagger) */
  .rise { animation: rise 0.8s var(--ease-out) both; animation-delay: calc(var(--i, 0) * 160ms + 80ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

  /* ---------- hero: headline left, keynote numerals right ---------- */
  .hero { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s-5) var(--s-6); flex-wrap: wrap; margin: 0 var(--s-1) var(--s-5); }
  .eyebrow {
    display: inline-flex; align-items: center; gap: var(--s-2); margin: 0 0 var(--s-2);
    font-size: var(--text-footnote); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-text);
  }
  .headline {
    margin: 0; padding-bottom: 0.08em; font-size: clamp(2rem, 2.2vw + 1.1rem, 3.25rem); font-weight: 700; line-height: 1.05; letter-spacing: -0.04em;
    background: var(--brand-gradient); -webkit-background-clip: text; background-clip: text; color: transparent; text-wrap: balance;
  }
  .stats { display: flex; align-items: flex-end; margin: 0; }
  .stat { display: flex; flex-direction: column; align-items: flex-start; padding: 0 var(--s-6); border-left: 0.5px solid var(--separator); }
  .stat:first-child { padding-left: 0; border-left: 0; }
  .stat:last-child { padding-right: 0; }
  .stat b {
    order: -1; font-size: clamp(2.5rem, 2.4vw + 1.4rem, 4rem); font-weight: 700; line-height: 1; letter-spacing: -0.045em; color: var(--label);
  }
  .stat span { margin-top: var(--s-2); color: var(--label-2); font-size: var(--text-footnote); font-weight: 600; }

  /* ---------- panels ---------- */
  .card {
    position: relative; background: var(--surface); border-radius: var(--r-xl); padding: var(--s-5) var(--s-4) var(--s-4); min-width: 0;
    box-shadow: 0 0 0 1px var(--separator), var(--shadow-2), inset 0 1px 0 rgb(255 255 255 / 5%);
  }
  .card-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px var(--s-3); margin: 0 var(--s-2) var(--s-4); }
  .card-head:has(.sort) { align-items: center; }
  /* "Sort by" menu: a quiet pill that opens a small floating panel (the browser's own select list cannot be styled) */
  .sort { position: relative; display: inline-flex; align-items: center; gap: var(--s-2); color: var(--label-2); font-size: var(--text-footnote); }
  .sort-btn {
    display: inline-flex; align-items: center; gap: var(--s-2); min-height: 34px; padding: 0 var(--s-3) 0 var(--s-4);
    border: 0; border-radius: var(--r-pill); background: var(--fill); color: var(--label); font: inherit; font-weight: 600; cursor: pointer;
    box-shadow: inset 0 0 0 1px var(--separator);
    transition: background var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
  }
  .sort-btn:hover { background: var(--fill-hover); }
  .sort-btn:active { transform: scale(0.97); }
  .sort-btn[aria-expanded='true'] { background: var(--surface); box-shadow: inset 0 0 0 1px var(--accent-ring), 0 0 0 3px var(--accent-tint); }
  .sort-btn svg { width: 12px; height: 12px; color: var(--label-2); transition: transform var(--dur-base) var(--ease-out); }
  .sort-btn[aria-expanded='true'] svg { transform: rotate(180deg); }
  .sort-list {
    position: absolute; top: calc(100% + 6px); right: 0; z-index: 30; min-width: 190px; margin: 0; padding: 6px; list-style: none;
    background: var(--surface); border-radius: var(--r-md);
    box-shadow: 0 0 0 1px var(--separator), 0 12px 32px rgb(0 0 0 / 28%), 0 2px 6px rgb(0 0 0 / 12%);
    transform-origin: top right; animation: sort-pop var(--dur-base) var(--ease-spring);
  }
  .sort-list[hidden] { display: none; }
  @keyframes sort-pop { from { opacity: 0; transform: translateY(-4px) scale(0.96); } }
  .sort-list li {
    display: flex; align-items: center; justify-content: space-between; gap: var(--s-4); min-height: 36px; padding: 0 var(--s-3);
    border-radius: var(--r-sm); color: var(--label); font-size: var(--text-footnote); font-weight: 500; cursor: pointer; white-space: nowrap;
  }
  .sort-list li .hint { color: var(--label-2); font-size: var(--text-caption); font-weight: 500; }
  .sort-list li:hover, .sort-list li.active { background: var(--fill); }
  .sort-list li[aria-selected='true'] { color: var(--accent-text); font-weight: 700; }
  .sort-list li .check { width: 14px; height: 14px; flex: none; visibility: hidden; color: var(--accent-text); }
  .sort-list li[aria-selected='true'] .check { visibility: visible; }
  .sort-list li .opt { display: flex; align-items: center; gap: var(--s-2); }
  @media (pointer: coarse) { .sort-btn, .sort-list li { min-height: var(--hit, 44px); } }
  .card h2 { font-size: var(--text-title2); font-weight: 700; letter-spacing: -0.03em; }
  .sub { margin: 0; color: var(--label-2); font-size: var(--text-footnote); line-height: 1.35; }
  .empty { padding: var(--s-6) 0; color: var(--label-2); text-align: center; font-size: var(--text-footnote); }

  /* boards + latest results: 1 column on phones, 2 on tablets, 3 side by side on wide screens */
  .dash { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s-4); align-items: start; }
  @media (min-width: 760px) {
    .dash { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .card.latest { grid-column: 1 / -1; }
  }
  @media (min-width: 1280px) {
    .dash { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.35fr); }
    .card.latest { grid-column: auto; }
    /* the narrow third column: tighter cells and P / R instead of Precision / Recall, so F1 stays in view */
    .latest th, .latest td { padding-left: var(--s-2); padding-right: var(--s-2); }
    .latest th[data-short] { font-size: 0; }
    .latest th[data-short]::after { content: attr(data-short); font-size: var(--text-caption); }
  }
  /* laptops: the third column is still too narrow for all seven columns; Budget is the one to give up */
  @media (min-width: 1280px) and (max-width: 1499px) {
    .latest .budget { display: none; }
    .latest td.room-cell { font-size: var(--text-footnote); }
    .latest td.f1 { font-size: var(--text-body); }
    .latest td.time { padding-left: var(--s-3); }
  }
  /* short screens (1280×720): a smaller hero keeps the boards in view */
  @media (min-width: 760px) and (max-height: 820px) {
    .page { padding-top: var(--s-4); }
    .hero { margin-bottom: var(--s-4); }
    .headline { font-size: clamp(1.75rem, 1.6vw + 1rem, 2.5rem); }
    .stat b { font-size: clamp(2.25rem, 1.8vw + 1.2rem, 3rem); }
    .card { padding-top: var(--s-4); }
    .card-head { margin-bottom: var(--s-3); }
  }

  /* ---------- leaderboard: a plain list split by hairlines ---------- */
  .board { position: relative; }
  .row {
    position: absolute; left: 0; right: 0; display: grid; grid-template-columns: 1.75rem minmax(0, 1fr) auto; align-items: center; gap: var(--s-3);
    padding: var(--s-3) var(--s-2) var(--s-3) var(--s-3); border-radius: var(--r-md);
    transition: transform 0.6s var(--ease-out), background var(--dur-base) var(--ease-out);
  }
  .row:not(.last)::after { content: ''; position: absolute; left: var(--s-2); right: var(--s-2); bottom: 0; border-bottom: 0.5px solid var(--separator); }
  .rank {
    display: grid; place-items: center; width: 1.75rem; height: 1.75rem; border-radius: 50%;
    background: var(--fill); color: var(--label-2); font-weight: 700; font-size: var(--text-footnote);
  }
  .row.first .rank { background: var(--cta-bg); color: var(--cta-fg); }
  .who { min-width: 0; }
  .name {
    display: flex; align-items: center; gap: var(--s-2); font-weight: 600; font-size: var(--text-body); line-height: 1.3; letter-spacing: -0.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .name span { flex: 0 1 auto; min-width: 3em; overflow: hidden; text-overflow: ellipsis; }
  .row.first .name { font-weight: 700; }
  /* room colour: a stripe on the row's left edge and, for players, a tag with the room's name.
     Players of one room share the colour of that room's row in Top rooms and of its dots in Latest results. */
  .row::before {
    content: ''; position: absolute; left: 0; top: var(--s-2); bottom: var(--s-2); width: 3px; border-radius: var(--r-pill);
    background: var(--team, transparent);
  }
  .room-tag {
    flex: 0 4 auto; min-width: 2.5em; max-width: 55%; overflow: hidden; text-overflow: ellipsis; /* gives way before the player's name */
    padding: 1px var(--s-2); border-radius: var(--r-pill); font-style: normal; font-size: var(--text-caption); font-weight: 600; letter-spacing: 0;
    color: var(--label); background: color-mix(in srgb, var(--team) 22%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--team) 45%, transparent);
  }
  .room-tag:empty { display: none; }
  .meta { color: var(--label-2); font-size: var(--text-caption); line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track { height: 4px; margin-top: var(--s-2); border-radius: var(--r-pill); background: var(--fill); overflow: hidden; }
  .track > i { display: block; height: 100%; border-radius: var(--r-pill); background: var(--label-3); transition: width 0.9s var(--ease-out); }
  .row.first .track > i { background: var(--brand-gradient); }
  .score { text-align: right; font-size: var(--text-title3); font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; }
  .row.first .score > span {
    font-size: var(--text-title2);
    background: var(--brand-gradient); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .score small { display: block; font-size: var(--text-caption); font-weight: 500; letter-spacing: 0; color: var(--label-2); }

  /* ---------- latest results: drawn like the boards (no frame, hairline rows, room stripe) ---------- */
  .table-wrap { overflow: auto; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: var(--text-footnote); }
  th, td { padding: 0 var(--s-3); text-align: left; white-space: nowrap; }
  th {
    height: 28px; vertical-align: top; color: var(--label-2); font-size: var(--text-caption); font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 0.5px solid var(--separator);
  }
  td { height: 55px; border-bottom: 0.5px solid var(--separator); color: var(--label-2); }
  tbody tr:last-child td { border-bottom: 0; }
  /* the room's colour runs down the row's left edge, as on the boards */
  td:first-child { position: relative; }
  tbody tr:not(.empty-row) td:first-child::before {
    content: ''; position: absolute; left: 0; top: var(--s-2); bottom: var(--s-2); width: 3px; border-radius: var(--r-pill); background: var(--team, transparent);
  }
  th.num, td.num { text-align: right; }
  td.num { color: var(--label); }
  td.f1 { font-size: var(--text-title3); font-weight: 700; letter-spacing: -0.03em; color: var(--label); }
  td.room-cell { font-size: var(--text-body); font-weight: 600; color: var(--label); }
  td.time { padding-left: var(--s-4); font-variant-numeric: tabular-nums; }
  td.empty { white-space: normal; }

  @media (max-width: 600px) {
    .topbar { padding: 0 var(--s-4); }
    .wordmark { font-size: var(--text-title3); }
    .logo { height: 26px; padding: 4px 10px; }
    .page { padding: var(--s-4) var(--s-3) var(--s-5); }

</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="wordmark">Matelda</span>
    <img class="logo" src="bifold_logo.png" alt="BIFOLD">

    <button class="lang-toggle" id="lang" type="button"></button>
    -->

</header>

<main class="page">
  <div class="aurora" aria-hidden="true"></div>
  <header class="hero">

    </div>

  <div class="dash">
    <section class="card rise" style="--i:2">
      <div class="card-head"><h2 data-i18n="topRooms"></h2>
        <div class="sort" data-board="rooms"><span class="sort-label" id="sort-rooms-label" data-i18n="sortBy"></span>
          <button class="sort-btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="sort-rooms-label sort-rooms-btn" id="sort-rooms-btn"></button>
          <ul class="sort-list" role="listbox" id="sort-rooms-list" aria-labelledby="sort-rooms-label" tabindex="-1" hidden></ul></div></div>
      <div class="board" id="rooms"></div>
    </section>

      <div class="card-head"><h2 data-i18n="topPlayers"></h2>

          <button class="sort-btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="sort-players-label sort-players-btn" id="sort-players-btn"></button>

        <thead><tr><th data-i18n="thTime"></th><th data-i18n="thRoom"></th><th data-i18n="thPlayer"></th><th class="num budget" data-i18n="thBudget"></th>
          <th class="num" data-i18n="thPrecision" data-short="P"></th><th class="num" data-i18n="thRecall" data-short="R"></th><th class="num" data-i18n="thF1"></th></tr></thead>
        <tbody></tbody>
      </table></div>
    </section>
  </div>
</main>
<script>
const PB = location.origin;

// Language: same storage key and toggle look as the app. The head script already set <html lang>.
// Technical terms (Labels, Pipeline, Budget, Precision, Recall, F1) stay English in German, as in the app.
const LANG_KEY = "matelda-lang";
const I18N = {
  en: {
    connecting: "Connecting…", live: "Live", reconnecting: "Reconnecting…",
    eyebrow: "Leaderboard · all rooms", headline: "Clean data, together.",
    statRooms: "rooms", statPlayers: "players", statLabels: "labels",
    topRooms: "Top rooms", topPlayers: "Top players",
    sortBy: "Sort by",
    m_correct: "Correct labels", m_labels: "Labels", m_accuracy: "Accuracy", m_players: "Players", m_speed: "Speed",
    u_correct: "correct", u_labels: "labels", u_accuracy: "accurate", u_players: "players", u_speed: "per label",
    h_speed: "fastest first", h_run: "best run",
    m_f1: "F1", m_precision: "Precision", m_recall: "Recall", u_f1: "F1", u_precision: "precision", u_recall: "recall",
    latest: "Latest results", latestSub: "most recent pipeline runs",
    thTime: "Time", thRoom: "Room", thPlayer: "Player", thBudget: "Budget",
    thPrecision: "Precision", thRecall: "Recall", thF1: "F1",
    correct: "correct",
    emptyBoard: "Waiting for the first labels…",
    emptyRuns: "No finished runs yet. Results appear here as rooms finish the pipeline.",
    themeTo: mode => `Switch to ${mode} mode`,
    langSwitch: "Auf Deutsch umschalten",
  },
  de: {
    connecting: "Verbinde …", live: "Live", reconnecting: "Verbindung wird wiederhergestellt …",
    eyebrow: "Rangliste · alle Räume", headline: "Daten bereinigen – gemeinsam.",
    statRooms: "Räume", statPlayers: "Personen", statLabels: "Labels",
    topRooms: "Beste Räume", topPlayers: "Beste Personen",
    sortBy: "Sortieren nach",
    m_correct: "Richtige Labels", m_labels: "Labels", m_accuracy: "Trefferquote", m_players: "Personen", m_speed: "Tempo",
    u_correct: "richtig", u_labels: "Labels", u_accuracy: "richtig", u_players: "Personen", u_speed: "pro Label",
    h_speed: "schnellste zuerst", h_run: "bester Run",
    m_f1: "F1", m_precision: "Precision", m_recall: "Recall", u_f1: "F1", u_precision: "Precision", u_recall: "Recall",
    latest: "Neueste Ergebnisse", latestSub: "zuletzt abgeschlossene Pipeline-Durchläufe",
    thTime: "Zeit", thRoom: "Raum", thPlayer: "Person", thBudget: "Budget",
    thPrecision: "Precision", thRecall: "Recall", thF1: "F1",
    correct: "richtig",
    emptyBoard: "Warten auf die ersten Labels …",
    emptyRuns: "Noch keine abgeschlossenen Durchläufe. Die Ergebnisse erscheinen hier, sobald Räume die Pipeline abgeschlossen haben.",
    themeTo: mode => (mode === "dark" ? "Zum dunklen Modus wechseln" : "Zum hellen Modus wechseln"),
    langSwitch: "Switch to English",
  },
};
function getLang() { return document.documentElement.lang === "de" ? "de" : "en"; }
function T(key, ...args) {
  const v = I18N[getLang()][key];
  return typeof v === "function" ? v(...args) : v;
}
let statusKey = "connecting"; // connecting | live | reconnecting
function paintStatus() {
  document.getElementById("state").textContent = T(statusKey);
}
function paintLang() {
  const btn = document.getElementById("lang");
  if (!btn) return; // the language switch is hidden for now
  btn.textContent = getLang().toUpperCase();
  btn.setAttribute("aria-label", T("langSwitch"));
  btn.title = T("langSwitch");
}
function applyLang() {
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = T(el.dataset.i18n); });
  paintStatus();
  paintLang();
  paintToggle();
  document.querySelectorAll("#runs td.empty").forEach(el => { el.textContent = T("emptyRuns"); });
  document.querySelectorAll(".board .empty").forEach(el => { el.textContent = T("emptyBoard"); });
  paintSorts();
}
document.getElementById("lang")?.addEventListener("click", () => {
  const next = getLang() === "en" ? "de" : "en";
  document.documentElement.lang = next;
  try { localStorage.setItem(LANG_KEY, next); } catch (e) {}
  applyLang();
  refresh();
});

// Theme toggle: sun in dark mode, moon in light mode (same icons as the app's ThemeToggle)
const SUN = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
const MOON = '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';
function currentTheme() {
  const t = document.documentElement.dataset.theme;
  if (t === "light" || t === "dark") return t;
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function paintToggle() {
  const t = currentTheme(), next = t === "dark" ? "light" : "dark";
  const btn = document.getElementById("theme");
  btn.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (t === "dark" ? SUN : MOON) + "</svg>";
  btn.setAttribute("aria-label", T("themeTo", next));
  btn.title = T("themeTo", next);
}
applyLang();
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", paintToggle);
document.getElementById("theme").onclick = () => {
  const next = currentTheme() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("matelda-theme", next); } catch (e) {}
  paintToggle();
};

// Top 8 on wide screens, top 5 on phones so the page stays short.
const narrow = matchMedia("(max-width: 600px)");
const maxRows = () => (narrow.matches ? 5 : 8);
// Every room gets its own colour: rooms in creation order step around the colour wheel by the golden angle
// (~137.5°), so neighbours never land close together; the lightness alternates for a second cue.
// A room keeps its colour for as long as it exists (new rooms only append). Rooms the list does not know
// (e.g. a run of a deleted room) fall back to a hash of the name.
let roomColors = new Map();
function hueColor(i) {
  const h = Math.round((215 + i * 137.508) % 360), l = [58, 70, 48][i % 3];
  return `hsl(${h} 72% ${l}%)`;
}
function assignRoomColors(rooms) {
  const order = [...rooms].sort((a, b) => (a.created || "").localeCompare(b.created || "") || a.name.localeCompare(b.name));
  roomColors = new Map(order.map((r, i) => [r.name, hueColor(i)]));
}
function teamColor(room) {
  if (roomColors.has(room)) return roomColors.get(room);
  let h = 0;
  for (const ch of room) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return hueColor(h % 360);
}
const COLLECTIONS = ["rooms", "players", "labels", "runs"];

async function fetchAll(collection, fields) {
  const out = [];
  for (let page = 1; ; page++) {
    const r = await fetch(`${PB}/api/collections/${collection}/records?perPage=500&page=${page}&fields=${fields}`);
    if (!r.ok) throw new Error(collection + " " + r.status);
    const d = await r.json();
    out.push(...d.items);
    if (page >= d.totalPages) return out;
  }
}

// The best run of each room and each player: the one with the highest F1 (on a tie the later one). Its precision and
// recall go with it, so the three numbers on the board always belong to the same run.
function bestRuns(runs, keyOf) {
  const out = new Map();
  for (const r of runs) {
    const k = keyOf(r), had = out.get(k);
    const better = !had || Number(r.f1) > Number(had.f1) || (Number(r.f1) === Number(had.f1) && (r.created || "") > (had.created || ""));
    if (k && better) out.set(k, r);
  }
  return out;
}
const scoresOf = run => (run
  ? { f1: Number(run.f1), precision: Number(run.precision), recall: Number(run.recall) }
  : { f1: null, precision: null, recall: null });

function compute(rooms, players, labels, allRuns = []) {
  const runByRoom = bestRuns(allRuns, r => r.room), runByPlayer = bestRuns(allRuns, r => r.player);
  const byPlayer = new Map(), byRoom = new Map();
  for (const l of labels) {
    const p = byPlayer.get(l.player) || { n: 0, ok: 0, ms: 0 };
    p.n++; if (l.is_correct) p.ok++; p.ms += Number(l.latency_ms) || 0;
    byPlayer.set(l.player, p);
    const r = byRoom.get(l.room) || { n: 0, ok: 0 };
    r.n++; if (l.is_correct) r.ok++;
    byRoom.set(l.room, r);
  }
  const playersPerRoom = new Map();
  for (const p of players) playersPerRoom.set(p.room, (playersPerRoom.get(p.room) || 0) + 1);
  const values = s => ({ correct: s.ok, labels: s.n, accuracy: s.n ? (100 * s.ok) / s.n : 0 });
  const roomRows = rooms.map(r => {
    const s = byRoom.get(r.name) || { n: 0, ok: 0 };
    return { key: r.name, title: r.name, color: teamColor(r.name),
             v: { ...values(s), players: playersPerRoom.get(r.name) || 0, ...scoresOf(runByRoom.get(r.name)) } };
  });
  const playerRows = players.map(p => {
    const s = byPlayer.get(p.id) || { n: 0, ok: 0, ms: 0 };
    return { key: p.id, title: p.name, color: teamColor(p.room), room: p.room,
             v: { ...values(s), speed: s.n && s.ms ? s.ms / s.n : null, ...scoresOf(runByPlayer.get(p.id)) } };
  }).filter(p => p.v.labels > 0);

  return { roomRows, playerRows, totals: { rooms: rooms.length, players: players.length, labels: labels.length } };
}

// Latest pipeline runs (collection may not exist yet on an older setup)
async function fetchRuns() {
  try {
    const r = await fetch(`${PB}/api/collections/runs/records?perPage=${maxRows()}&sort=-created`);
    return r.ok ? (await r.json()).items : [];
  } catch (e) { return []; }
}
function renderRuns(runs) {
  const body = document.querySelector("#runs tbody");
  body.textContent = "";
  if (!runs.length) {
    const tr = document.createElement("tr");
    tr.className = "empty-row";
    const td = document.createElement("td");
    td.colSpan = 7; td.className = "empty"; td.textContent = T("emptyRuns");
    tr.append(td);
    body.append(tr);
    return;
  }
  for (const r of runs) {
    const tr = document.createElement("tr");
    tr.style.setProperty("--team", teamColor(r.room || ""));
    const add = (text, cls) => {
      const td = document.createElement("td");
      td.textContent = text; td.className = cls;
      tr.append(td);
      return td;
    };
    add((r.created || "").slice(11, 19), "time");
    add(r.room, "room-cell");
    add(r.player_name, "");
    add(r.budget, "num budget");
    add(Number(r.precision).toFixed(2), "num");
    add(Number(r.recall).toFixed(2), "num");
    add(Number(r.f1).toFixed(2), "num f1");
    body.append(tr);
  }
}

// --- animated leaderboard: keyed rows move with CSS transforms ---
const boards = {};
const GAP = 9; // px between rows
// --- what a board ranks by: picked in its dropdown, remembered per browser; only that value is shown ---
const METRICS = {
  rooms: ["correct", "labels", "accuracy", "players", "f1", "precision", "recall"],
  players: ["correct", "labels", "accuracy", "speed", "f1", "precision", "recall"],
};
const RUN_METRICS = ["f1", "precision", "recall"]; // from the best run; rooms and players without one go last
const FORMAT = {
  correct: v => String(Math.round(v)), labels: v => String(Math.round(v)), players: v => String(Math.round(v)),
  accuracy: v => `${Math.round(v)}%`,
  speed: v => (v == null ? "–" : `${(v / 1000).toFixed(1)} s`),
  f1: v => (v == null ? "–" : v.toFixed(2)), precision: v => (v == null ? "–" : v.toFixed(2)), recall: v => (v == null ? "–" : v.toFixed(2)),
};
const sortBy = {};
for (const id of Object.keys(METRICS)) {
  let saved = null;
  try { saved = localStorage.getItem(`matelda-dash-sort-${id}`); } catch (e) {}
  sortBy[id] = METRICS[id].includes(saved) ? saved : "correct";
}
const CHEVRON = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CHECK = '<svg class="check" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5 6.5 11.5 12.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function paintSorts() {
  if (!sortsReady) return; // applyLang() runs once before the sort settings below exist
  for (const [id, metrics] of Object.entries(METRICS)) {
    const btn = document.getElementById(`sort-${id}-btn`), list = document.getElementById(`sort-${id}-list`);
    btn.innerHTML = "";
    btn.append(T(`m_${sortBy[id]}`));
    btn.insertAdjacentHTML("beforeend", CHEVRON);
    list.innerHTML = "";
    for (const m of metrics) {
      const li = document.createElement("li");
      li.id = `sort-${id}-${m}`; li.role = "option"; li.dataset.metric = m;
      li.setAttribute("aria-selected", String(m === sortBy[id]));
      const opt = document.createElement("span"); opt.className = "opt";
      opt.insertAdjacentHTML("beforeend", CHECK);
      opt.append(T(`m_${m}`));
      li.append(opt);
      const hintKey = m === "speed" ? "h_speed" : RUN_METRICS.includes(m) ? "h_run" : null; // speed runs the other way
      if (hintKey) {
        const hint = document.createElement("span"); hint.className = "hint";
        hint.textContent = T(hintKey);
        li.append(hint);
      }
      list.append(li);
    }
  }
}
function pickSort(id, m) {
  sortBy[id] = m;
  try { localStorage.setItem(`matelda-dash-sort-${id}`, m); } catch (e) {}
  paintSorts();
  if (boards[id]?.rows) render(id, boards[id].rows);
}
// one menu open at a time; outside click, Escape and Tab close it; arrows move, Enter / Space pick
let openSort = null;
function setActive(list, li) {
  list.querySelectorAll("li").forEach(x => x.classList.toggle("active", x === li));
  if (li) list.setAttribute("aria-activedescendant", li.id);
}
function openMenu(id) {
  closeMenu();
  const btn = document.getElementById(`sort-${id}-btn`), list = document.getElementById(`sort-${id}-list`);
  list.hidden = false; btn.setAttribute("aria-expanded", "true");
  setActive(list, list.querySelector('[aria-selected="true"]'));
  list.focus();
  openSort = id;
}
function closeMenu(refocus) {
  if (!openSort) return;
  const btn = document.getElementById(`sort-${openSort}-btn`), list = document.getElementById(`sort-${openSort}-list`);
  list.hidden = true; btn.setAttribute("aria-expanded", "false");
  if (refocus) btn.focus();
  openSort = null;
}
document.querySelectorAll(".sort").forEach(box => {
  const id = box.dataset.board, list = box.querySelector(".sort-list");
  box.querySelector(".sort-btn").addEventListener("click", () => (openSort === id ? closeMenu() : openMenu(id)));
  list.addEventListener("click", e => {
    const li = e.target.closest("li");
    if (li) { closeMenu(true); pickSort(id, li.dataset.metric); }
  });
  list.addEventListener("mousemove", e => { const li = e.target.closest("li"); if (li) setActive(list, li); });
  list.addEventListener("keydown", e => {
    const items = [...list.querySelectorAll("li")], cur = items.findIndex(x => x.classList.contains("active"));
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      setActive(list, items[(cur + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length]);
    } else if (e.key === "Home" || e.key === "End") {
      e.preventDefault(); setActive(list, items[e.key === "Home" ? 0 : items.length - 1]);
    } else if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      if (items[cur]) { closeMenu(true); pickSort(id, items[cur].dataset.metric); }
    } else if (e.key === "Escape") { e.preventDefault(); closeMenu(true); }
    else if (e.key === "Tab") closeMenu();
  });
});
document.addEventListener("pointerdown", e => { if (openSort && !e.target.closest(".sort")) closeMenu(); });
var sortsReady = true; // a var: applyLang() may read it before this line has run
paintSorts();
// Speed: less time per label is better, so it ranks ascending and players without a time go last.
function ranked(boardId, rows) {
  const m = sortBy[boardId], asc = m === "speed";
  const val = r => r.v[m];
  return [...rows].sort((a, b) => {
    const x = val(a), y = val(b);
    if (x == null || y == null) { if (x != y) return x == null ? 1 : -1; }
    else if (x !== y) return asc ? x - y : y - x;
    return b.v.correct - a.v.correct || a.title.localeCompare(b.title);
  }).map(r => ({ ...r, score: val(r), metric: m, unit: T(`u_${m}`) }));
}

function render(boardId, rawRows) {
  const root = document.getElementById(boardId);
  const state = boards[boardId] || (boards[boardId] = { els: new Map() });
  state.rows = rawRows;
  const rows = ranked(boardId, rawRows);
  const shown = rows.slice(0, maxRows());
  // the bar: share of the best value (for speed the fastest is the full bar)
  const nums = shown.map(r => r.score).filter(v => v != null);
  const best = sortBy[boardId] === "speed" ? Math.min(...nums) : Math.max(1, ...nums);
  const max = best;
  if (!shown.length && !root.querySelector(".empty")) {
    root.innerHTML = '<div class="empty"></div>';
    root.firstChild.textContent = T("emptyBoard");
  }
  if (shown.length) root.querySelector(".empty")?.remove();

  const keep = new Set();
  shown.forEach((r, i) => {
    keep.add(r.key);
    let el = state.els.get(r.key);
    if (!el) {
      el = document.createElement("div");
      el.className = "row";
      el.innerHTML = '<div class="rank"></div><div class="who"><div class="name"><span></span><em class="room-tag"></em></div>' +
                     '<div class="track"><i></i></div></div><div class="score"><span></span><small></small></div>';
      el.style.transform = "translateY(2000px)"; // enter from below
      root.append(el);
      state.els.set(r.key, el);
      place(el, r, i, max);
      requestAnimationFrame(() => requestAnimationFrame(() => layout(boardId)));
    } else {
      place(el, r, i, max);
    }
    el.classList.toggle("last", i === shown.length - 1);
  });
  state.order = shown.map(r => r.key);
  for (const [key, el] of state.els) {
    if (!keep.has(key)) { el.remove(); state.els.delete(key); }
  }
  layout(boardId);
}
// Stack rows by their measured height (text wraps on narrow cards)
function layout(boardId) {
  const root = document.getElementById(boardId), state = boards[boardId];
  if (!state || !state.order) return;
  let y = 0;
  for (const key of state.order) {
    const el = state.els.get(key);
    if (!el) continue;
    el.style.transform = `translateY(${y}px)`;
    y += el.offsetHeight + GAP;
  }
  root.style.height = Math.max(y - GAP, 1) + "px";
}
window.addEventListener("resize", () => Object.keys(boards).forEach(layout));
narrow.addEventListener?.("change", () => Object.entries(boards).forEach(([id, b]) => b.rows && render(id, b.rows)));
function place(el, r, i, max) {
  el.style.setProperty("--team", r.color);
  el.classList.toggle("first", i === 0 && r.score != null && r.score > 0);
  el.querySelector(".rank").textContent = i + 1;
  el.querySelector(".name span").textContent = r.title;
  el.querySelector(".room-tag").textContent = r.room || "";
  el.querySelector(".name").title = r.room ? `${r.title} · ${r.room}` : r.title;
  const share = r.score == null ? 0 : r.metric === "speed" ? max / r.score : r.score / max;
  el.querySelector(".track > i").style.width = (100 * Math.min(1, share)) + "%";
  countTo(el.querySelector(".score span"), r.score, FORMAT[r.metric]);
  el.querySelector(".score small").textContent = r.unit;
}

// --- count-up numbers (instant under reduced motion) ---
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
function countTo(el, target, fmt = v => String(Math.round(v))) {
  const from = Number(el.dataset.v ?? 0), run = (el.dataset.run = String(Number(el.dataset.run || 0) + 1));
  el.dataset.v = target ?? 0;
  if (target == null || from === target || reduceMotion.matches) { el.textContent = fmt(target); return; }
  const t0 = performance.now();
  (function step(t) {
    if (el.dataset.run !== run) return; // a newer count (e.g. another sort) took over
    const k = Math.min(1, (t - t0) / 500);
    el.textContent = k < 1 ? fmt(from + (target - from) * k) : fmt(target);
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}

let refreshing = false, again = false;
async function refresh() {
  if (refreshing) { again = true; return; }
  refreshing = true;
  try {
    const [rooms, players, labels, runs, allRuns] = await Promise.all([
      fetchAll("rooms", "name,dataset,created"),
      fetchAll("players", "id,room,name"),
      fetchAll("labels", "room,player,is_correct,latency_ms"),
      fetchRuns(),
      fetchAll("runs", "room,player,precision,recall,f1,created").catch(() => []), // older setups have no runs yet
    ]);
    assignRoomColors(rooms);
    const d = compute(rooms, players, labels, allRuns);
    render("rooms", d.roomRows);
    render("players", d.playerRows);
    renderRuns(runs);
    countTo(document.getElementById("t-rooms"), d.totals.rooms);
    countTo(document.getElementById("t-players"), d.totals.players);
    countTo(document.getElementById("t-labels"), d.totals.labels);
  } catch (e) {
    console.error(e);
  } finally {
    refreshing = false;
    if (again) { again = false; refresh(); }
  }
}
// Bursts of events (a room filling up, everyone labeling) become one refresh 150 ms after the first event. The timer
// is not restarted by later events: a steady stream must not keep pushing the refresh back for ever.
let timer = null;
function scheduleRefresh() {
  if (timer) return;
  timer = setTimeout(() => { timer = null; refresh(); }, 150);
}

// --- PocketBase realtime (SSE); reconnects automatically ---
function setLive(on) {
  document.getElementById("status").classList.toggle("live", on);
  statusKey = on ? "live" : "reconnecting";
  paintStatus();
}
function connect() {
  const es = new EventSource(`${PB}/api/realtime`);
  es.addEventListener("PB_CONNECT", async e => {
    const { clientId } = JSON.parse(e.data);
    await fetch(`${PB}/api/realtime`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ clientId, subscriptions: COLLECTIONS }),
    });
    setLive(true);
    refresh();
  });
  COLLECTIONS.forEach(c => es.addEventListener(c, scheduleRefresh));
  es.onerror = () => setLive(false);
}
connect();
setInterval(refresh, 15000); // safety net if an event is ever missed
</script>
